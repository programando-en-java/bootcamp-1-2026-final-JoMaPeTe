version: '3.8'

services:
  flight-service:
    build:
      context: ./flight-service
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    networks:
      - airline-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    networks:
      - airline-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    networks:
      - airline-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  checkin-service:
    build:
      context: ./checkin-service
      dockerfile: Dockerfile
    ports:
      - "8084:8080"
    networks:
      - airline-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    networks:
      - airline-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

networks:
  airline-network:
    driver: bridge